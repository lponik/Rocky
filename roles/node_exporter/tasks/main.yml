---
- name: Ensure Node Exporter user exists
  become: true
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /sbin/nologin
    create_home: false
    state: present

- name: Download Node Exporter
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}.tar.gz"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}.tar.gz"
    mode: "0644"

- name: Extract Node Exporter
  become: true
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}/node_exporter"

- name: Install Node Exporter binary
  become: true
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}/node_exporter"
    dest: "{{ node_exporter_install_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Configure Node Exporter systemd service
  become: true
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Ensure Node Exporter is running and enabled
  become: true
  ansible.builtin.systemd_service:
    name: node_exporter
    state: started
    enabled: true
