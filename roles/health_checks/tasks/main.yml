---
- name: Deploy health check script
  become: true
  ansible.builtin.copy:
    src: health-check.sh
    dest: /usr/local/bin/health-check.sh
    owner: root
    group: root
    mode: "0755"

- name: Configure health check systemd service
  become: true
  ansible.builtin.copy:
    src: health-check.service
    dest: /etc/systemd/system/health-check.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Configure health check timer
  become: true
  ansible.builtin.template:
    src: health-check.timer.j2
    dest: /etc/systemd/system/health-check.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Apply health check systemd changes
  ansible.builtin.meta: flush_handlers

- name: Ensure health check timer is enabled and running
  become: true
  ansible.builtin.systemd_service:
    name: health-check.timer
    state: started
    enabled: true
